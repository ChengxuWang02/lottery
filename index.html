<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社区抽奖活动</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 2.2em;
            margin: 20px 0;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab-btn {
            padding: 10px 30px;
            border: 2px solid #ffd200;
            background: transparent;
            color: #ffd200;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: linear-gradient(90deg, #f7971e, #ffd200);
            color: #1a1a2e;
            font-weight: bold;
        }

        /* 抽奖区域 */
        .lottery-section {
            text-align: center;
        }

        .user-input {
            margin-bottom: 20px;
        }

        .user-input label {
            font-size: 1.1em;
            margin-right: 10px;
        }

        .user-input input {
            padding: 8px 15px;
            border-radius: 20px;
            border: 2px solid #ffd200;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1em;
            outline: none;
            width: 200px;
        }

        .user-input input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .info-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 210, 0, 0.3);
        }

        .info-item span {
            color: #ffd200;
            font-weight: bold;
        }

        .draw-btn {
            padding: 15px 60px;
            font-size: 1.3em;
            border: none;
            border-radius: 50px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin: 20px 0;
            box-shadow: 0 5px 20px rgba(255, 210, 0, 0.3);
        }

        .draw-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 210, 0, 0.5);
        }

        .draw-btn:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 抽奖动画 */
        .draw-animation {
            display: none;
            margin: 20px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255, 210, 0, 0.3);
        }

        .draw-animation.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .prize-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
            border: 1px solid rgba(255, 210, 0, 0.2);
            animation: popIn 0.3s ease-out;
            animation-fill-mode: both;
        }

        .prize-card.points { border-color: rgba(76, 175, 80, 0.5); background: rgba(76, 175, 80, 0.1); }
        .prize-card.avatar { border-color: rgba(156, 39, 176, 0.5); background: rgba(156, 39, 176, 0.1); }
        .prize-card.gift { border-color: rgba(255, 87, 34, 0.5); background: rgba(255, 87, 34, 0.1); }

        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .prize-card .icon {
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .prize-card .name {
            font-size: 0.85em;
            color: #ddd;
        }



        /* 管理面板 */
        .admin-section {
            display: none;
        }

        .admin-section.active {
            display: block;
        }

        .lottery-section.active {
            display: block;
        }

        .lottery-section {
            display: none;
        }

        .records-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .records-table th, .records-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .records-table th {
            background: rgba(255, 210, 0, 0.15);
            color: #ffd200;
            font-weight: bold;
        }

        .records-table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-bar input, .filter-bar select {
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 210, 0, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 0.9em;
            outline: none;
        }

        .filter-bar select option {
            background: #1a1a2e;
            color: #fff;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255, 210, 0, 0.2);
        }

        .stat-card .number {
            font-size: 2em;
            color: #ffd200;
            font-weight: bold;
        }

        .stat-card .label {
            font-size: 0.9em;
            color: #aaa;
            margin-top: 5px;
        }

        .btn-reset {
            padding: 8px 20px;
            border: 1px solid #ff5555;
            background: transparent;
            color: #ff5555;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .btn-reset:hover {
            background: #ff5555;
            color: #fff;
        }

        .btn-export {
            padding: 8px 20px;
            border: 1px solid #4caf50;
            background: transparent;
            color: #4caf50;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .btn-export:hover {
            background: #4caf50;
            color: #fff;
        }

        .no-records {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 1.1em;
        }

        .my-records {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 210, 0, 0.2);
        }

        .my-records h3 {
            color: #ffd200;
            margin-bottom: 10px;
        }

        .group-title {
            color: #ffd200;
            margin: 10px 0 5px;
            font-size: 0.95em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 社区抽奖活动 🎉</h1>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('lottery')">抽奖</button>
            <button class="tab-btn" onclick="switchTab('admin')">中奖记录管理</button>
        </div>

        <!-- 抽奖区域 -->
        <div class="lottery-section active" id="lotterySection">
            <div class="user-input">
                <label>参与者昵称：</label>
                <input type="text" id="username" placeholder="请输入昵称" maxlength="20">
            </div>

            <div class="info-bar">
                <div class="info-item">今日已抽: <span id="drawCount">0</span> / 3 组</div>
                <div class="info-item">每组抽取: <span>11</span> 个奖品</div>
                <div class="info-item">奖池剩余: <span id="poolRemain">53</span> 个</div>
            </div>

            <button class="draw-btn" id="drawBtn" onclick="startDraw()">开始抽奖（第1组）</button>

            <div class="draw-animation" id="drawAnimation">
                <h3 style="color: #ffd200; margin-bottom: 10px;">🎊 恭喜获得以下奖品：</h3>
                <div class="results-grid" id="resultsGrid"></div>
            </div>

            <!-- 我的今日记录 -->
            <div class="my-records" id="myRecords" style="display:none;">
                <h3>📋 我的今日抽奖记录</h3>
                <div id="myRecordsList"></div>
            </div>


        </div>

        <!-- 管理面板 -->
        <div class="admin-section" id="adminSection">
            <div class="stats-summary" id="statsSummary"></div>

            <div class="filter-bar">
                <input type="text" id="filterUser" placeholder="搜索用户昵称..." oninput="renderRecords()">
                <select id="filterDate" onchange="renderRecords()">
                    <option value="">全部日期</option>
                </select>
                <button class="btn-export" onclick="exportRecords()">📥 导出CSV</button>
                <button class="btn-reset" onclick="resetAll()">🗑️ 重置所有数据</button>
            </div>

            <table class="records-table">
                <thead>
                    <tr>
                        <th>用户</th>
                        <th>日期</th>
                        <th>第几组</th>
                        <th>奖品详情</th>
                    </tr>
                </thead>
                <tbody id="recordsBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // 奖池配置
        const PRIZE_CONFIG = [
            { name: '社区积分1分', total: 17, icon: '🪙', type: 'points' },
            { name: '社区积分3分', total: 12, icon: '🪙', type: 'points' },
            { name: '社区积分5分', total: 8, icon: '🪙', type: 'points' },
            { name: '社区积分10分', total: 5, icon: '💰', type: 'points' },
            { name: '头像框1', total: 3, icon: '🖼️', type: 'avatar' },
            { name: '头像框2', total: 3, icon: '🖼️', type: 'avatar' },
            { name: '头像框3', total: 3, icon: '🖼️', type: 'avatar' },
            { name: '小礼品1', total: 1, icon: '🎁', type: 'gift' },
            { name: '小礼品2', total: 1, icon: '🎁', type: 'gift' },
        ];

        const DRAWS_PER_GROUP = 11;
        const GROUPS_PER_DAY = 3;

        // 数据管理
        function getToday() {
            return new Date().toISOString().split('T')[0];
        }

        function getData() {
            const data = localStorage.getItem('lottery_data');
            if (!data) {
                return {
                    prizePool: PRIZE_CONFIG.map(p => ({ ...p, remaining: p.total })),
                    records: []
                };
            }
            return JSON.parse(data);
        }

        function saveData(data) {
            localStorage.setItem('lottery_data', JSON.stringify(data));
        }

        function getUserDrawCount(username) {
            const data = getData();
            const today = getToday();
            return data.records.filter(r => r.username === username && r.date === today).length;
        }

        // 切换标签
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (tab === 'lottery') {
                document.getElementById('lotterySection').classList.add('active');
                document.getElementById('adminSection').classList.remove('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.getElementById('lotterySection').classList.remove('active');
                document.getElementById('adminSection').classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                renderRecords();
                renderStats();
            }
        }

        // 更新奖池剩余数显示
        function updatePoolDisplay() {
            const data = getData();
            const totalRemain = data.prizePool.reduce((s, p) => s + p.remaining, 0);
            document.getElementById('poolRemain').textContent = totalRemain;
        }

        // 更新抽奖按钮状态
        function updateDrawBtn() {
            const username = document.getElementById('username').value.trim();
            const btn = document.getElementById('drawBtn');
            const data = getData();
            const totalRemain = data.prizePool.reduce((s, p) => s + p.remaining, 0);

            if (!username) {
                btn.disabled = true;
                btn.textContent = '请先输入昵称';
                return;
            }

            const count = getUserDrawCount(username);
            document.getElementById('drawCount').textContent = count;

            if (count >= GROUPS_PER_DAY) {
                btn.disabled = true;
                btn.textContent = '今日抽奖次数已用完';
            } else if (totalRemain === 0) {
                btn.disabled = true;
                btn.textContent = '奖池已空';
            } else {
                btn.disabled = false;
                btn.textContent = `开始抽奖（第${count + 1}组）`;
            }
        }

        // 抽奖逻辑
        function startDraw() {
            const username = document.getElementById('username').value.trim();
            if (!username) {
                alert('请输入昵称！');
                return;
            }

            const data = getData();
            const totalRemain = data.prizePool.reduce((s, p) => s + p.remaining, 0);
            const count = getUserDrawCount(username);

            if (count >= GROUPS_PER_DAY) {
                alert('今日抽奖次数已用完！');
                return;
            }

            if (totalRemain === 0) {
                alert('奖池已空！');
                return;
            }

            // 计算本次可抽取数量
            const drawCount = Math.min(DRAWS_PER_GROUP, totalRemain);

            // 构建加权抽奖池
            let pool = [];
            data.prizePool.forEach((prize, index) => {
                for (let i = 0; i < prize.remaining; i++) {
                    pool.push(index);
                }
            });

            // 随机抽取
            const results = [];
            for (let i = 0; i < drawCount; i++) {
                if (pool.length === 0) break;
                const randIdx = Math.floor(Math.random() * pool.length);
                const prizeIdx = pool[randIdx];
                results.push(prizeIdx);
                // 从池中移除该奖品
                pool.splice(randIdx, 1);
                data.prizePool[prizeIdx].remaining--;
            }

            // 记录结果
            const record = {
                username: username,
                date: getToday(),
                group: count + 1,
                prizes: results.map(idx => data.prizePool[idx].name),
                timestamp: new Date().toLocaleString('zh-CN')
            };
            data.records.push(record);
            saveData(data);

            // 显示结果动画
            showResults(results, data.prizePool);
            updatePoolDisplay();
            updateDrawBtn();
            showMyRecords(username);
        }

        // 显示抽奖结果
        function showResults(results, prizePool) {
            const grid = document.getElementById('resultsGrid');
            const animation = document.getElementById('drawAnimation');
            animation.classList.add('active');
            grid.innerHTML = '';

            results.forEach((prizeIdx, i) => {
                const prize = PRIZE_CONFIG[prizeIdx];
                setTimeout(() => {
                    grid.innerHTML += `<div class="prize-card ${prize.type}" style="animation-delay: ${i * 0.05}s">
                        <div class="icon">${prize.icon}</div>
                        <div class="name">${prize.name}</div>
                    </div>`;
                }, i * 100);
            });
        }

        // 显示我的记录
        function showMyRecords(username) {
            const data = getData();
            const today = getToday();
            const myRecords = data.records.filter(r => r.username === username && r.date === today);

            if (myRecords.length === 0) {
                document.getElementById('myRecords').style.display = 'none';
                return;
            }

            document.getElementById('myRecords').style.display = 'block';
            const list = document.getElementById('myRecordsList');
            list.innerHTML = myRecords.map(r => {
                const prizeSummary = {};
                r.prizes.forEach(p => { prizeSummary[p] = (prizeSummary[p] || 0) + 1; });
                const details = Object.entries(prizeSummary).map(([k, v]) => `${k}×${v}`).join('、');
                return `<div class="group-title">第${r.group}组 (${r.timestamp})</div>
                    <div style="color:#ccc; font-size:0.9em; margin-bottom:10px; padding-left:10px;">${details}</div>`;
            }).join('');
        }

        // 管理面板 - 渲染记录
        function renderRecords() {
            const data = getData();
            const filterUser = document.getElementById('filterUser').value.trim().toLowerCase();
            const filterDate = document.getElementById('filterDate').value;

            let records = data.records;
            if (filterUser) {
                records = records.filter(r => r.username.toLowerCase().includes(filterUser));
            }
            if (filterDate) {
                records = records.filter(r => r.date === filterDate);
            }

            const tbody = document.getElementById('recordsBody');
            if (records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="no-records">暂无抽奖记录</td></tr>';
                return;
            }

            tbody.innerHTML = records.slice().reverse().map(r => {
                const prizeSummary = {};
                r.prizes.forEach(p => { prizeSummary[p] = (prizeSummary[p] || 0) + 1; });
                const details = Object.entries(prizeSummary).map(([k, v]) => `${k}×${v}`).join('、');
                return `<tr>
                    <td>${escapeHtml(r.username)}</td>
                    <td>${r.date}</td>
                    <td>第${r.group}组</td>
                    <td>${escapeHtml(details)}</td>
                </tr>`;
            }).join('');

            // 更新日期筛选
            const dates = [...new Set(data.records.map(r => r.date))].sort().reverse();
            const dateSelect = document.getElementById('filterDate');
            const currentVal = dateSelect.value;
            dateSelect.innerHTML = '<option value="">全部日期</option>' +
                dates.map(d => `<option value="${d}" ${d === currentVal ? 'selected' : ''}>${d}</option>`).join('');
        }

        // 统计信息
        function renderStats() {
            const data = getData();
            const totalDraws = data.records.length;
            const totalPrizes = data.records.reduce((s, r) => s + r.prizes.length, 0);
            const uniqueUsers = [...new Set(data.records.map(r => r.username))].length;
            const totalRemain = data.prizePool.reduce((s, p) => s + p.remaining, 0);

            document.getElementById('statsSummary').innerHTML = `
                <div class="stat-card"><div class="number">${uniqueUsers}</div><div class="label">参与人数</div></div>
                <div class="stat-card"><div class="number">${totalDraws}</div><div class="label">总抽奖组数</div></div>
                <div class="stat-card"><div class="number">${totalPrizes}</div><div class="label">已发放奖品</div></div>
                <div class="stat-card"><div class="number">${totalRemain}</div><div class="label">奖池剩余</div></div>
            `;
        }

        // 导出CSV
        function exportRecords() {
            const data = getData();
            if (data.records.length === 0) {
                alert('暂无记录可导出');
                return;
            }

            let csv = '\uFEFF用户,日期,组别,奖品详情\n';
            data.records.forEach(r => {
                const prizeSummary = {};
                r.prizes.forEach(p => { prizeSummary[p] = (prizeSummary[p] || 0) + 1; });
                const details = Object.entries(prizeSummary).map(([k, v]) => `${k}×${v}`).join('、');
                csv += `"${r.username}","${r.date}","第${r.group}组","${details}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `抽奖记录_${getToday()}.csv`;
            link.click();
        }

        // 重置数据
        function resetAll() {
            if (confirm('确定要重置所有抽奖数据吗？此操作不可撤销！')) {
                if (confirm('再次确认：这将清空所有中奖记录和奖池数据！')) {
                    localStorage.removeItem('lottery_data');
                    location.reload();
                }
            }
        }

        // XSS防护
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // 初始化
        function init() {
            updatePoolDisplay();
            updateDrawBtn();

            document.getElementById('username').addEventListener('input', () => {
                updateDrawBtn();
                const username = document.getElementById('username').value.trim();
                if (username) {
                    showMyRecords(username);
                }
            });

            // 如果有之前输入的用户名
            const savedUser = sessionStorage.getItem('lottery_username');
            if (savedUser) {
                document.getElementById('username').value = savedUser;
                updateDrawBtn();
                showMyRecords(savedUser);
            }

            document.getElementById('username').addEventListener('change', (e) => {
                sessionStorage.setItem('lottery_username', e.target.value.trim());
            });
        }

        init();
    </script>
</body>
</html>
